<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bloco 17 - Carrinho</title>
  <link rel="stylesheet" href="styles/carrinho.css">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
</head>
<body>

<header>
  <div class="logo">
    <a href=""><img src="imgs/logo.png" alt=""></a>
    <h3>Bloco 17</h3>
  </div>
  <div class="tema">
    <h3>Seu Carrinho <i class="ri-shopping-cart-2-fill"></i></h3>
  </div>
  <nav>
    <a href="main.html">Home</a>
    <a href="login.html">Conta</a>
  </nav>
</header>

<main>
  <div class="content">
    <section>
      <table>
        <thead>
          <tr>
            <th>Produtos</th>
            <th>Preço</th>
            <th>Quantidade</th>
            <th>Total</th>
            <th>-</th>
          </tr>
        </thead>
        <tbody>
          <!-- O JS preenche aqui automaticamente -->
        </tbody>
      </table>
    </section>

    <div class="rodape">

      <!-- CUPOM -->
      <div class="cupom-wrap">
        <input type="text" id="inputCupom" placeholder="Código do cupom">
        <button class="btn-cupom">Aplicar</button>
      </div>
      <span class="cupom-ok" id="cupomOk"></span>

      <!-- TOTAL -->
      <div class="total-wrap">
        <span class="total-label">Total</span>
        <span class="total-valor" id="totalValor">R$ 0,00</span>
        <span class="total-parcelado">Ou <span>12x de R$ 0,00</span> sem juros</span>
        <button class="btn-finalizar">Finalizar compra →</button>
      </div>

    </div>
  </div>
</main>

<!-- Script SEMPRE antes de fechar o body -->
<script src="JS/carrinho.js"></script>
</body>
</html>
