<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bloco 17 - Carrinho</title>
  <link rel="stylesheet" href="styles/carrinho.css">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
  <style>
    /* Dados do usuário logado */
    .usuario-info {
      display: flex;
      flex-direction: column;
      gap: .4rem;
      padding: 1rem;
      background: #111;
      border: 1px solid #2a2a2a;
      border-radius: 8px;
      width: 100%;
      max-width: 420px;
    }
    .usuario-email {
      font-size: 14px;
      font-weight: 600;
      color: #F2F2F2;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Opções de pagamento */
    .pagamento-wrap {
      display: flex;
      flex-direction: column;
      gap: .6rem;
      width: 100%;
      max-width: 420px;
    }
    .payment-select { display: flex; gap: 8px; }
    .payment-option {
      flex: 1;
      background: #111;
      border: 1px solid #2a2a2a;
      border-radius: 8px;
      padding: .75rem .5rem;
      text-align: center;
      cursor: pointer;
      transition: all .15s;
    }
    .payment-option:hover,
    .payment-option.selected {
      border-color: #C1121F;
      background: rgba(193,18,31,.08);
    }
    .payment-option input[type=radio] { display: none; }
    .pay-icon { font-size: 1.4rem; display: block; margin-bottom: 4px; }
    .payment-option span:last-child { font-size: 11px; font-weight: 600; color: #B8B8B8; }

    /* Seção de confirmação fica escondida no início */
    #secaoConfirmacao { display: none; }
  </style>
</head>
<body>

<header>
  <div class="logo">
    <a href=""><img src="imgs/logo.png" alt=""></a>
    <h3>Bloco 17</h3>
  </div>
  <div class="tema">
    <h3>Seu Carrinho <i class="ri-shopping-cart-2-fill"></i></h3>
  </div>
  <nav>
    <a href="main.html">Home</a>
    <a href="login.html">Conta</a>
  </nav>
</header>

<main>
  <div class="content">

    <!-- SEÇÃO 1: lista do carrinho -->
    <section id="secaoCarrinho">
      <table>
        <thead>
          <tr>
            <th>Produtos</th>
            <th>Preço</th>
            <th>Quantidade</th>
            <th>Total</th>
            <th>-</th>
          </tr>
        </thead>
        <tbody>
          <!-- preenchido pelo carrinho.js -->
        </tbody>
      </table>

      <div class="rodape">
        <!-- Cupom de desconto -->
        <div class="cupom-wrap">
          <input type="text" id="inputCupom" placeholder="Código do cupom">
          <button class="btn-cupom">Aplicar</button>
        </div>
        <span class="cupom-ok" id="cupomOk"></span>

        <!-- Total e botão de finalizar -->
        <div class="total-wrap">
          <span class="total-label">Total</span>
          <span class="total-valor" id="totalValor">R$ 0,00</span>
          <span class="total-parcelado">Ou <span>12x de R$ 0,00</span> sem juros</span>
          <button class="btn-finalizar" onclick="irParaConfirmacao()">
            Finalizar compra →
          </button>
        </div>
      </div>
    </section>

    <!-- SEÇÃO 2: confirmação do pedido -->
    <section id="secaoConfirmacao">
      <table>
        <thead>
          <tr>
            <th>Produto</th>
            <th>Preço unit.</th>
            <th>Qtd</th>
            <th>Subtotal</th>
          </tr>
        </thead>
        <tbody id="tbodyConfirmacao">
          <!-- preenchido pelo JS -->
        </tbody>
      </table>

      <div class="rodape">

        <!-- Dados do usuário logado (preenchido pelo JS) -->
        <div id="usuarioWrap"></div>

        <!-- Forma de pagamento: só PIX -->
        <div class="pagamento-wrap">
          <span class="total-label">Forma de Pagamento</span>
          <div class="payment-select">
            <label class="payment-option selected" onclick="selectPayment(this)">
              <input type="radio" name="pagamento" value="PIX" checked>
              <span class="pay-icon">⚡</span>
              <span>PIX</span>
            </label>
          </div>

          <!-- Coloque sua imagem de QR Code em imgs/qrcode.png -->
          <div style="text-align:center; margin-top:12px;">
            <img src="imgs/qrcode.png" alt="QR Code PIX"
                 style="width:180px; height:180px; object-fit:contain; border-radius:8px;">
            <p style="font-size:0.85em; color:#888; margin-top:6px;">
              Escaneie o QR Code e após pagar clique em Confirmar
            </p>
          </div>
        </div>

        <!-- Total e botões de voltar/confirmar -->
        <div class="total-wrap">
          <span class="total-label">Total do Pedido</span>
          <span class="total-valor" id="totalConfirmacao">R$ 0,00</span>
          <span class="total-parcelado">Ou <span id="parcelaConf">12x de R$ 0,00</span> sem juros</span>
          <div style="display:flex; gap:.75rem; margin-top:.5rem">
            <button class="btn-salvar" onclick="voltarCarrinho()">← Voltar</button>
            <button class="btn-finalizar" onclick="confirmarPedido()">✅ Confirmar Compra</button>
          </div>
        </div>

      </div>
    </section>

  </div>
</main>

<script src="JS/carrinho.js"></script>
<script>
  const PARCELAS_CONF = 12
  let pagamentoSelecionado = "PIX"
  let usuarioLogado = null

  // Marca a opção de pagamento selecionada
  function selectPayment(el) {
    document.querySelectorAll('.payment-option').forEach(o => o.classList.remove('selected'))
    el.classList.add('selected')
    pagamentoSelecionado = el.querySelector('input[type=radio]').value
  }

  // Clicou em "Finalizar compra" — verifica login antes de ir pra confirmação
  function irParaConfirmacao() {
    const carrinho = lerCarrinho()
    if (carrinho.length === 0) {
      mostrarFeedback("Seu carrinho está vazio!")
      return
    }

    // Consulta o PHP para saber se o usuário está logado
    fetch("php/sessao.php")
      .then(r => {
        // Se o servidor não retornar OK, lança erro para cair no catch
        if (!r.ok) throw new Error("Servidor retornou status " + r.status)
        return r.json()
      })
      .then(dados => {
        // Não está logado → salva intenção e redireciona pro login
        if (!dados.logado) {
          localStorage.setItem("bloco17_redirect", "carrinho.html")
          window.location.href = "login.html"
          return
        }

        // Está logado → mostra a seção de confirmação
        usuarioLogado = dados
        document.getElementById("secaoCarrinho").style.display = "none"
        document.getElementById("secaoConfirmacao").style.display = "block"
        renderizarConfirmacao()
        exibirUsuario(dados)
      })
      .catch(erro => {
        // Mostra o erro real para facilitar o debug
        mostrarFeedback("Erro ao verificar login: " + erro.message + ". Abra pelo XAMPP!")
      })
  }

  // Volta para a seção do carrinho
  function voltarCarrinho() {
    document.getElementById("secaoConfirmacao").style.display = "none"
    document.getElementById("secaoCarrinho").style.display = "block"
  }

  // Preenche a tabela de confirmação com os itens do carrinho
  function renderizarConfirmacao() {
    const tbody     = document.getElementById("tbodyConfirmacao")
    const totalEl   = document.getElementById("totalConfirmacao")
    const parcelaEl = document.getElementById("parcelaConf")
    if (!tbody) return

    const carrinho = lerCarrinho()
    tbody.innerHTML = ""
    let total = 0

    carrinho.forEach(item => {
      const produto = CATALOGO.find(p => p.id === item.id)
      if (!produto) return

      const subtotal = produto.preco * item.quantidade
      total += subtotal

      const tr = document.createElement("tr")
      tr.innerHTML = `
        <td>
          <div class="produto">
            <img src="${produto.img}" alt="${produto.nome}">
            <div class="info">
              <div class="name">${produto.nome}</div>
              <div class="categoria">${produto.categoria}</div>
            </div>
          </div>
        </td>
        <td>R$ ${produto.preco.toFixed(2).replace(".", ",")}</td>
        <td>${item.quantidade}</td>
        <td>R$ ${subtotal.toFixed(2).replace(".", ",")}</td>
      `
      tbody.appendChild(tr)
    })

    if (totalEl)   totalEl.textContent   = "R$ " + total.toFixed(2).replace(".", ",")
    if (parcelaEl) parcelaEl.textContent = PARCELAS_CONF + "x de R$ " + (total / PARCELAS_CONF).toFixed(2).replace(".", ",")
  }

  // Mostra o nome e email do usuário logado na tela
  function exibirUsuario(dados) {
    const wrap = document.getElementById("usuarioWrap")
    if (!wrap) return
    wrap.innerHTML = `
      <div class="usuario-info">
        <span class="total-label">Comprando como</span>
        <div class="usuario-email">
          <i class="ri-user-fill"></i> ${dados.email}
          ${dados.nome ? `<span style="color:#6B6B6B;font-weight:400">— ${dados.nome}</span>` : ""}
        </div>
      </div>
    `
  }

  // Envia o pedido para o PHP salvar o arquivo .dat
  function confirmarPedido() {
    const carrinho = lerCarrinho()
    if (carrinho.length === 0) {
      mostrarFeedback("Carrinho vazio!")
      return
    }

    // Monta os itens no formato que o PHP espera
    const itens = carrinho.map(item => {
      const produto = CATALOGO.find(p => p.id === item.id)
      return {
        nome:       produto ? produto.nome  : "Produto",
        preco:      produto ? produto.preco : 0,
        quantidade: item.quantidade,
        subtotal:   produto ? produto.preco * item.quantidade : 0
      }
    })

    const totalNum = itens.reduce((acc, i) => acc + i.subtotal, 0)

    // Envia os dados via POST para salvar_venda.php
    fetch("php/salvar_venda.php", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        itens:     itens,
        total:     totalNum,
        pagamento: pagamentoSelecionado
      })
    })
    .then(r => {
      if (!r.ok) throw new Error("Servidor retornou status " + r.status)
      return r.json()
    })
    .then(res => {
      if (res.sucesso) {
        // Limpa o carrinho e mostra mensagem de sucesso
        localStorage.removeItem("bloco17_carrinho")
        mostrarFeedback("Pedido #" + res.numero_venda + " confirmado! 🎉")
        setTimeout(() => { window.location.href = "main.html" }, 2500)
      } else {
        mostrarFeedback("Erro: " + (res.erro || "tente novamente"))
      }
    })
    .catch(erro => {
      mostrarFeedback("Erro ao salvar pedido: " + erro.message)
    })
  }
</script>

</body>
</html>
