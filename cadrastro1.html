<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro | Bloco 17</title>

    <link
        rel="shortcut icon"
        href="#"
        type="image/x-icon"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.6.0/remixicon.min.css"
    >

    <link
        rel="stylesheet"
        href="styles/login.css"
    >
</head>

<body>

    <main class="login">

        <div class="login_content">

            <!-- Conteúdo do formulário -->
            <section class="login_form_content">

                <h1 class="login_title">
                    Faça parte do Bloco. Cadastre-se. 🐀
                </h1>

                <form
                    action="php/cadastro.php"
                    method="post"
                    class="login_form"
                >

                    <div class="login_group">

                        <!-- Nome completo -->
                        <div class="login_box">

                            <i
                                class="ri-user-fill login_icon"
                                aria-hidden="true"
                            ></i>

                            <input
                                type="text"
                                id="nome_completo"
                                name="nome_completo"
                                class="login_input"
                                placeholder="Nome completo"
                                autocomplete="name"
                                required
                            >

                            <label
                                for="nome_completo"
                                class="login_label"
                            >
                                Nome completo
                            </label>

                        </div>


                        <!-- CPF -->
                        <div class="login_box">

                            <i
                                class="ri-user-follow-fill login_icon"
                                aria-hidden="true"
                            ></i>

                            <input
                                type="text"
                                id="cpf"
                                name="cpf"
                                class="login_input"
                                placeholder="CPF"
                                inputmode="numeric"
                                autocomplete="off"
                                maxlength="14"
                                required
                            >

                            <label
                                for="cpf"
                                class="login_label"
                            >
                                CPF
                            </label>

                        </div>


                        <!-- CEP -->
                        <div class="login_box">

                            <i
                                class="ri-mail-send-fill login_icon"
                                aria-hidden="true"
                            ></i>

                            <input
                                type="text"
                                id="cep"
                                name="cep"
                                class="login_input"
                                placeholder="CEP"
                                inputmode="numeric"
                                autocomplete="postal-code"
                                maxlength="9"
                                required
                            >

                            <label
                                for="cep"
                                class="login_label"
                            >
                                CEP
                            </label>

                        </div>


                        <!-- Endereço preenchido pela ViaCEP -->
                        <div class="login_box">

                            <i
                                class="ri-roadster-fill login_icon"
                                aria-hidden="true"
                            ></i>

                            <input
                                type="text"
                                id="endereco"
                                name="endereco"
                                class="login_input"
                                placeholder="Endereço"
                                autocomplete="street-address"
                                required
                            >

                            <label
                                for="endereco"
                                class="login_label"
                            >
                                Endereço
                            </label>

                        </div>


                        <!-- Número da residência -->
                        <div class="login_box">

                            <i
                                class="ri-home-2-line login_icon"
                                aria-hidden="true"
                            ></i>

                            <input
                                type="text"
                                id="numero"
                                name="numero"
                                class="login_input"
                                placeholder="Número"
                                autocomplete="address-line2"
                                maxlength="10"
                                required
                            >

                            <label
                                for="numero"
                                class="login_label"
                            >
                                Número
                            </label>

                        </div>


                        <!-- Bairro preenchido pela ViaCEP -->
                        <div class="login_box">

                            <i
                                class="ri-map-pin-line login_icon"
                                aria-hidden="true"
                            ></i>

                            <input
                                type="text"
                                id="bairro"
                                name="bairro"
                                class="login_input"
                                placeholder="Bairro"
                                autocomplete="address-level3"
                                required
                            >

                            <label
                                for="bairro"
                                class="login_label"
                            >
                                Bairro
                            </label>

                        </div>


                        <!-- Cidade preenchida pela ViaCEP -->
                        <div class="login_box">

                            <i
                                class="ri-building-4-line login_icon"
                                aria-hidden="true"
                            ></i>

                            <input
                                type="text"
                                id="cidade"
                                name="cidade"
                                class="login_input"
                                placeholder="Cidade"
                                autocomplete="address-level2"
                                required
                            >

                            <label
                                for="cidade"
                                class="login_label"
                            >
                                Cidade
                            </label>

                        </div>


                        <!-- Estado selecionado ou preenchido pela ViaCEP -->
                        <div class="login_box">

                            <i
                                class="ri-map-pin-2-fill login_icon"
                                aria-hidden="true"
                            ></i>

                            <select
                                id="estado"
                                name="estado"
                                class="login_input"
                                autocomplete="address-level1"
                                required
                            >
                                <option
                                    value=""
                                    disabled
                                    selected
                                >
                                    Selecione o estado
                                </option>

                                <option value="AC">Acre</option>
                                <option value="AL">Alagoas</option>
                                <option value="AP">Amapá</option>
                                <option value="AM">Amazonas</option>
                                <option value="BA">Bahia</option>
                                <option value="CE">Ceará</option>
                                <option value="DF">Distrito Federal</option>
                                <option value="ES">Espírito Santo</option>
                                <option value="GO">Goiás</option>
                                <option value="MA">Maranhão</option>
                                <option value="MT">Mato Grosso</option>
                                <option value="MS">Mato Grosso do Sul</option>
                                <option value="MG">Minas Gerais</option>
                                <option value="PA">Pará</option>
                                <option value="PB">Paraíba</option>
                                <option value="PR">Paraná</option>
                                <option value="PE">Pernambuco</option>
                                <option value="PI">Piauí</option>
                                <option value="RJ">Rio de Janeiro</option>
                                <option value="RN">Rio Grande do Norte</option>
                                <option value="RS">Rio Grande do Sul</option>
                                <option value="RO">Rondônia</option>
                                <option value="RR">Roraima</option>
                                <option value="SC">Santa Catarina</option>
                                <option value="SP">São Paulo</option>
                                <option value="SE">Sergipe</option>
                                <option value="TO">Tocantins</option>
                            </select>

                            <label
                                for="estado"
                                class="login_label"
                            >
                                Estado
                            </label>

                        </div>

                    </div>


                    <!-- Envio da primeira etapa -->
                    <button
                        type="submit"
                        name="salvar1"
                        value="1"
                        class="login_button"
                    >
                        Próximo

                        <i
                            class="ri-send-plane-2-fill"
                            aria-hidden="true"
                        ></i>
                    </button>

                </form>

            </section>


            <!-- Imagem lateral -->
            <aside class="login_image">

                <img
                    src="imgs/login_centreal_bloco17.png"
                    alt="Identidade visual do Bloco 17"
                    class="login_img"
                >

            </aside>

        </div>

    </main>


    <!-- Bibliotecas e scripts -->
    <script
        src="https://cdn.jsdelivr.net/npm/gsap@3.14.1/dist/gsap.min.js"
    ></script>

    <script src="JS/loginani.js"></script>

    <script src="JS/apicep.js"></script>

</body>

</html>
