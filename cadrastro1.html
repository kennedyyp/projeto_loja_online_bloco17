<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro Simples - Bloco 17</title>
    <link rel="shortcut icon" href="#" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.6.0/remixicon.min.css">
    <link rel="stylesheet" href="styles/login.css">
</head>
<body>

    <main class="login">
        <div class="login_content">
            <div>
                <h2 class="login_title">Faça parte do Bloco. Cadastre-se.🐀</h2>
                <form action="php/cadastro.php" method="post" class="login_form">
                    <!-- Formulário com os campos de dados e endereço -->
                    <div class="login_group">
                        <div class="login_box">
                            <i class="ri-user-fill login_icon"></i>
                            <input type="text" autocomplete="off" required placeholder="Nome Completo" class="login_input" id="nome_completo" name="nome_completo">
                            <label for="nome_completo" class="login_label">Nome Completo</label>
                        </div>

                        <div class="login_box">
                            <i class="ri-user-follow-fill login_icon"></i>
                            <input type="text" autocomplete="off" required placeholder="CPF" class="login_input" id="cpf" name="cpf">
                            <label for="cpf" class="login_label">CPF</label>
                        </div>

                        <div class="login_box">
                            <i class="ri-roadster-fill login_icon"></i>
                            <input type="text" autocomplete="off" required placeholder="Endereço" class="login_input" id="endereco" name="endereco">
                            <label for="endereco" class="login_label">Endereço</label>
                        </div>

                        <div class="login_box">
                            <i class="ri-map-pin-line login_icon"></i>
                            <input type="text" autocomplete="off" required placeholder="Bairro" class="login_input" id="bairro" name="bairro">
                            <label for="bairro" class="login_label">Bairro</label>
                        </div>

                        <div class="login_box">
                            <i class="ri-building-4-line login_icon"></i>
                            <input type="text" autocomplete="off" required placeholder="Cidade" class="login_input" id="cidade" name="cidade">
                            <label for="cidade" class="login_label">Cidade</label>
                        </div>

                        <div class="login_box">
                            <i class="ri-map-pin-2-fill login_icon"></i>
                            <input type="text" autocomplete="off" required placeholder="Estado" class="login_input" id="estado" name="estado">
                            <label for="estado" class="login_label">Estado</label>
                        </div>

                        <div class="login_box">
                            <i class="ri-file-copy-2-fill login_icon"></i>
                            <input type="text" autocomplete="off" required placeholder="CEP" class="login_input" id="cep" name="cep">
                            <label for="cep" class="login_label">CEP</label>
                        </div>
                    </div>

                    <button type="submit" class="login_button" name="salvar1" value="1">
                        Próximo <i class="ri-send-plane-2-fill"></i>
                    </button>
                </form>
            </div>

            <div class="login_image">
                <img src="imgs/login_centreal_bloco17.png" alt="Imagem de cadastro" class="login_img">
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.1/dist/gsap.min.js"></script>
    <script src="JS/loginani.js"></script>
</body>
</html>
